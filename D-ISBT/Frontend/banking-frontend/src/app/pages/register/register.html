<div class="register-container">
  <h2>Creare cont</h2>

  <form (ngSubmit)="register()" autocomplete="off">

    <input
      type="text"
      name="firstNameRegister"
      placeholder="Prenume"
      [(ngModel)]="form.firstName"
      autocomplete="off"
      required
    >

    <input
      type="text"
      name="lastNameRegister"
      placeholder="Nume"
      [(ngModel)]="form.lastName"
      autocomplete="off"
      required
    >

    <input
      type="email"
      name="emailRegister"
      placeholder="Email"
      [(ngModel)]="form.email"
      autocomplete="new-email"
      required
    >

    <input
      type="text"
      name="phoneRegister"
      placeholder="Telefon"
      [(ngModel)]="form.phone"
      autocomplete="off"
      required
    >

    <input
      type="text"
      name="addressRegister"
      placeholder="Adresă"
      [(ngModel)]="form.address"
      autocomplete="off"
      required
    >

    <input
      type="date"
      name="dateOfBirthRegister"
      [(ngModel)]="form.dateOfBirth"
      autocomplete="off"
      required
    >

    <input
      type="password"
      name="passwordRegister"
      placeholder="Parolă"
      [(ngModel)]="form.password"
      autocomplete="new-password"
      required
    >

    <input
      type="password"
      name="confirmPasswordRegister"
      placeholder="Confirmă parola"
      [(ngModel)]="confirmPassword"
      autocomplete="new-password"
      required
    >

    <label>
      <input
        type="checkbox"
        name="acceptedTermsRegister"
        [(ngModel)]="form.acceptedTerms"
      >
      Accept termenii și condițiile băncii
    </label>

    <button type="submit">Înregistrează-te</button>
  </form>

  <p *ngIf="message" style="color: green;">{{ message }}</p>
  <p *ngIf="error" style="color: red;">{{ error }}</p>
</div>
<p>
  Ai deja cont?
  <a routerLink="/">Autentifică-te</a>
</p>
